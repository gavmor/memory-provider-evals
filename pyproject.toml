[project]
name = "memory-provider-evals"
version = "0.1.0"
description = "DeepEval suite benchmarking Hermes durable-memory providers on the traced-harness instrument"
readme = "README.md"
authors = [
    { name = "Gavin Morgan", email = "hello@gavmor.com" }
]
requires-python = ">=3.12"
dependencies = [
    "traced-harness>=0.1.0",
    "deepeval>=4.2.8",
    "benchkit-for-harnesses",
]

[project.optional-dependencies]
# Cashew's real backend. An extra rather than a dependency: hermes-cashew
# pulls cashew-brain, torch and sentence-transformers (several GB), and
# cashew-brain claims the top-level `core`, `extractors`, `integration` and
# `scripts` module names. Provision it deliberately with
# `uv sync --extra cashew`; without it `MEMORY_PROVIDER=cashew` reports an
# unprovisioned backend instead of scoring zero.
cashew = [
    "hermes-cashew>=0.10.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.9.0",
]

[project.scripts]
memorybench = "memory_provider_evals.live:main"

# traced-harness is not published to PyPI; consume it from GitHub.
# uv.lock pins the exact resolved commit, so builds stay reproducible;
# refresh with `uv lock --upgrade-package traced-harness`.
#
# TEMPORARY: pinned to the branch carrying TurnResult.metadata and the memory
# tool hook (gavmor/traced-harness `feat/memory-telemetry-and-tools`). Flip
# back to `branch = "main"` and re-lock once that PR merges.
[tool.uv.sources]
traced-harness = { git = "https://github.com/gavmor/traced-harness", branch = "feat/memory-telemetry-and-tools" }
benchkit-for-harnesses = { git = "https://github.com/cartazio/benchkit_for_harnesses" }
# Not on PyPI: its own `cashew-brain` dependency is a pinned direct URL, which
# PyPI rejects. uv.lock pins the resolved commit, so the extra is reproducible.
hermes-cashew = { git = "https://github.com/magnus919/hermes-cashew" }

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "evals: end-to-end DeepEval suites needing a live model and a provisioned memory backend",
]
# Bare `pytest` runs the unit suite only. Run the eval suite explicitly:
#   deepeval test run tests/evals/test_memory_providers.py -m evals
addopts = "-m 'not evals'"
